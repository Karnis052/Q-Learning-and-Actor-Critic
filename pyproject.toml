[project]
name = "hw3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karnis Fatema", email = "karnis052@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gym>=0.26.2",
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "wandb>=0.30.0",
]


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
